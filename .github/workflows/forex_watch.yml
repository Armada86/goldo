name: Broker F watcher

# Live tick watcher for the Broker F engine -- see forex_watcher.py and docs/forex-b.md. Triggered externally by cron-job.org
# (workflow_dispatch), like poll.yml, every 5 minutes, weekdays 7:00am-5:55pm America/New_York (runs after 5pm only matter while a
# trade is open; otherwise they exit at once).
#
# Runs deliberately OVERLAP (no concurrency group): the watcher takes a lease in Postgres, so only one run trades at a time. Each run
# loops for max_minutes (default 25). A dispatch that finds a healthy active run with more than 7 minutes left exits at once; one that
# lands in its last 7 minutes becomes the warm standby (streams prices, never trades) and takes over the instant the active run
# finishes, so there is no gap between runs. The mode comes from the repo VARIABLE FOREX_B_MODE (Settings > Secrets and variables >
# Actions > Variables): unset or "shadow" = record only, no order; "live" = real orders on the FOREX.com DEMO account. Run
# forex_live_check.yml successfully before setting it to live.
on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "How long to loop before exiting"
        default: "25"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python forex_watcher.py --mode "${{ vars.FOREX_B_MODE || 'shadow' }}" --max-minutes "${{ inputs.max_minutes || '5' }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FOREX_USERNAME: ${{ secrets.FOREX_USERNAME }}
          FOREX_PASSWORD: ${{ secrets.FOREX_PASSWORD }}
          FOREX_APP_KEY: ${{ secrets.FOREX_APP_KEY }}
