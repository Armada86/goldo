name: Frequency check

# Triggered externally (once daily, 8 PM America/New_York) via
# cron-job.org calling the GitHub API workflow_dispatch endpoint -- same
# reason as poll.yml: GitHub's own `schedule:` cron is UTC-only (no DST
# handling) and has been unreliable on this repo, so we don't rely on it.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  frequency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # frequency_check_job.py rewrites intrahour_swing_thresholds.json in
      # place when a threshold has drifted off target, always sends the
      # Telegram report either way (unchanged vs. updated, per combo), and
      # always appends a row to the "Threshold history" table in
      # docs/frequency-test-thresholds.md -- that file changes every night,
      # even when no threshold did, since it's a daily log.
      - run: python frequency_check_job.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Commit whichever of the two files above actually changed, on a new
      # branch, open a PR, and merge it -- this is the "updated
      # automatically" half of the workflow; the Telegram message above is
      # the audit trail of what changed and why. This does NOT force past
      # branch protection (no --admin bypass): if main requires reviews or
      # passing checks, this merge step fails and the PR is left open for a
      # human to merge. Making it merge unattended on a protected branch is a
      # repo-settings choice for the owner to make deliberately (e.g. adding
      # this workflow's actor as an allowed bypasser), not something to force
      # from this file -- same as the cron-job.org scheduling setup in
      # CLAUDE.md, that configuration lives outside this repo.
      - name: Open and merge a PR for whatever changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed_files=""
          thresholds_changed=false
          if ! git diff --quiet -- intrahour_swing_thresholds.json; then
            changed_files="$changed_files intrahour_swing_thresholds.json"
            thresholds_changed=true
          fi
          if ! git diff --quiet -- docs/frequency-test-thresholds.md; then
            changed_files="$changed_files docs/frequency-test-thresholds.md"
          fi

          if [ -z "$changed_files" ]; then
            echo "Nothing changed, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="frequency-check/$(date -u +%Y-%m-%d)-${{ github.run_number }}"
          git checkout -b "$branch"
          git add $changed_files
          if [ "$thresholds_changed" = true ]; then
            commit_msg="Auto-update intrahour-swing thresholds ($(date -u +%Y-%m-%d))"
          else
            commit_msg="Log nightly frequency-check thresholds ($(date -u +%Y-%m-%d))"
          fi
          git commit -m "$commit_msg"
          git push origin "$branch"

          pr_url=$(gh pr create \
            --title "$commit_msg" \
            --body "Automated nightly frequency-check run -- see the Telegram report from this run for the per-indicator/window before/after." \
            --base main --head "$branch")

          gh pr merge "$pr_url" --squash --delete-branch
