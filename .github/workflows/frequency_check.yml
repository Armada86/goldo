name: Frequency check

# Triggered externally (weekdays only, 6 AM America/New_York -- cron-job.org
# is configured to skip Saturday/Sunday) via cron-job.org calling the GitHub
# API workflow_dispatch endpoint -- same reason as poll.yml: GitHub's own
# `schedule:` cron is UTC-only (no DST handling) and has been unreliable on
# this repo, so we don't rely on it.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  frequency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # frequency_check_job.py recomputes every threshold fresh (the average companion swing of
      # each indicator when gold itself moves $5/$10/$15, over a rolling 30-day window) and
      # rewrites intrahour_swing_thresholds.json with whichever ones actually changed, always
      # sends the Telegram report either way (unchanged vs. updated, per combo), and always logs
      # a row to the threshold_history table in Postgres (not a file in this repo -- see
      # docs/frequency-test-thresholds.md).
      - run: python frequency_check_job.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Commit intrahour_swing_thresholds.json if it changed, on a new
      # branch, open a PR, and merge it -- this is the "updated
      # automatically" half of the workflow; the Telegram message above is
      # the audit trail of what changed and why. Most weekdays this is a
      # no-op (nothing to commit), since a threshold only moves when the freshly
      # recomputed average actually differs from what's on disk. This does NOT force past branch protection (no --admin
      # bypass): if main requires reviews or passing checks, this merge step
      # fails and the PR is left open for a human to merge. Making it merge
      # unattended on a protected branch is a repo-settings choice for the
      # owner to make deliberately (e.g. adding this workflow's actor as an
      # allowed bypasser), not something to force from this file -- same as
      # the cron-job.org scheduling setup in CLAUDE.md, that configuration
      # lives outside this repo.
      - name: Commit intrahour_swing_thresholds.json if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- intrahour_swing_thresholds.json; then
            echo "Nothing changed, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="frequency-check/$(date -u +%Y-%m-%d)-${{ github.run_number }}"
          git checkout -b "$branch"
          git add intrahour_swing_thresholds.json
          commit_msg="Auto-update intrahour-swing thresholds ($(date -u +%Y-%m-%d))"
          git commit -m "$commit_msg"
          git push origin "$branch"

          pr_url=$(gh pr create \
            --title "$commit_msg" \
            --body "Automated weekday frequency-check run -- see the Telegram report from this run for the per-indicator/window before/after." \
            --base main --head "$branch")

          gh pr merge "$pr_url" --squash --delete-branch
