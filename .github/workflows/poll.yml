name: Poll indicators

# Triggered externally (every 5 min) via cron-job.org calling the GitHub API
# workflow_dispatch endpoint — GitHub's own `schedule:` cron trigger is not
# reliable enough for a 5-minute cadence (observed runs delayed/dropped for
# 90+ minutes on this repo), so we don't rely on it.
on:
  workflow_dispatch: {}

# At most one poll running and one waiting: when GitHub is slow to hand out a runner (observed 5 Oct 2026: runs sat
# unstarted for 15+ minutes), a newer waiting run replaces the older ones instead of every queued poll firing in a
# burst of stale polls once runners come back. A running poll is never cancelled.
concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # A normal poll takes ~1-2 minutes; this stops a hung one from holding the single running slot (and so
    # blocking every later poll) for GitHub's 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python poll_job.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          FOREX_USERNAME: ${{ secrets.FOREX_USERNAME }}
          FOREX_PASSWORD: ${{ secrets.FOREX_PASSWORD }}
          FOREX_APP_KEY: ${{ secrets.FOREX_APP_KEY }}
