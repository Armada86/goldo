name: Poll indicators

# Triggered externally (every 5 min) via cron-job.org calling the GitHub API
# workflow_dispatch endpoint — GitHub's own `schedule:` cron trigger is not
# reliable enough for a 5-minute cadence (observed runs delayed/dropped for
# 90+ minutes on this repo), so we don't rely on it.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python poll_job.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # broker.py's check_broker_trades() (called from poll_once() above) may have opened or closed a
      # paper trade this cycle, which rewrites docs/trades.md's Trades table wholesale from the
      # `trades` table in Postgres -- the source of truth; this file is just a synced view of it.
      # Commit it the same way frequency_check.yml commits its own file: a PR, squash-merged, no
      # --admin bypass -- if main requires reviews/passing checks this merge step just fails and the
      # PR is left open for a human, same limitation as that workflow. Most polls touch nothing here
      # (a trade only opens/closes when its rule's condition is met), so this step is a no-op most runs.
      - name: Commit docs/trades.md if the Broker made a trade this cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/trades.md; then
            echo "No trade this cycle, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="broker-trade/$(date -u +%Y-%m-%dT%H-%M-%S)-${{ github.run_number }}"
          git checkout -b "$branch"
          git add docs/trades.md
          git commit -m "Broker: log trade activity ($(date -u +%Y-%m-%dT%H:%M))"
          git push origin "$branch"

          pr_url=$(gh pr create \
            --title "Broker: log trade activity ($(date -u +%Y-%m-%dT%H:%M))" \
            --body "Automated -- docs/trades.md regenerated from the trades table after this poll's Broker check. See the Telegram message from this run for what opened or closed." \
            --base main --head "$branch")

          gh pr merge "$pr_url" --squash --delete-branch
