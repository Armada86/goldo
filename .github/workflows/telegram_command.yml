name: Telegram command

# Triggered externally by cron-job.org calling the workflow_dispatch endpoint, roughly every minute
# -- telegram_command_job.py checks for any new Telegram messages since its last run (offset stored
# in Postgres, see storage.get_last_telegram_update_id()) and opens a Broker A/B position on a
# recognized "buy/sell broker a/b" command. Most runs are a no-op (no new messages) within a second
# or two. Same external-cron pattern as poll.yml/release_watch_adp.yml -- this repo has no
# persistent server to run a Telegram webhook, so polling on a schedule is the only option.

on:
  workflow_dispatch: {}

jobs:
  telegram-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python telegram_command_job.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
